<template data-sc-template="catalog-tools">
  <section class="sc-catalog-tools" aria-label="Herramientas de la carta">
    <label class="sc-catalog-search">
      <svg class="sc-catalog-search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
      <input class="sc-catalog-search-input" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Buscar en la carta" aria-label="Buscar productos en la carta">
      <span class="sc-catalog-search-line" aria-hidden="true"></span>
    </label>
    <div class="sc-catalog-actions">
      <div class="sc-theme-control">
        <button class="sc-theme-toggle" type="button" aria-label="Tema automático. Elegir tema" title="Elegir tema" aria-haspopup="menu" aria-expanded="false" aria-controls="sc-theme-menu">
          <svg class="sc-theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <mask id="sc-theme-disc-mask">
                <rect x="0" y="0" width="24" height="24" fill="#fff"></rect>
                <circle class="sc-theme-cut" cx="16.1" cy="8.15" r="5.65" fill="#000"></circle>
              </mask>
            </defs>
            <g class="sc-theme-solar-glyph">
              <g class="sc-theme-rays">
                <line x1="12" y1="1.2" x2="12" y2="3.8"></line>
                <line x1="12" y1="20.2" x2="12" y2="22.8"></line>
                <line x1="1.2" y1="12" x2="3.8" y2="12"></line>
                <line x1="20.2" y1="12" x2="22.8" y2="12"></line>
                <line x1="4.35" y1="4.35" x2="6.18" y2="6.18"></line>
                <line x1="17.82" y1="17.82" x2="19.65" y2="19.65"></line>
                <line x1="17.82" y1="6.18" x2="19.65" y2="4.35"></line>
                <line x1="4.35" y1="19.65" x2="6.18" y2="17.82"></line>
              </g>
              <circle class="sc-theme-disc" cx="12" cy="12" r="5.55" mask="url(#sc-theme-disc-mask)"></circle>
            </g>
            <g class="sc-theme-auto-glyph">
              <circle class="sc-theme-auto-ring" cx="12" cy="12" r="8.4"></circle>
              <path class="sc-theme-auto-half" d="M12 3.6a8.4 8.4 0 0 1 0 16.8z"></path>
            </g>
          </svg>
        </button>
        <div class="sc-theme-menu" id="sc-theme-menu" role="menu" aria-label="Elegir tema" aria-hidden="true">
          <button class="sc-theme-option" type="button" role="menuitemradio" aria-checked="true" data-sc-theme-option="system">
            <span class="sc-theme-option-main">
              <svg class="sc-theme-option-icon sc-theme-option-icon--system" viewBox="0 0 18 18" aria-hidden="true">
                <circle class="sc-theme-option-auto-ring" cx="9" cy="9" r="5.5"></circle>
                <path class="sc-theme-option-auto-half" d="M9 3.5a5.5 5.5 0 0 1 0 11z"></path>
              </svg>
              <span>Automático</span>
            </span>
            <span class="sc-theme-option-mark" aria-hidden="true"></span>
          </button>
          <button class="sc-theme-option" type="button" role="menuitemradio" aria-checked="false" data-sc-theme-option="light">
            <span class="sc-theme-option-main">
              <svg class="sc-theme-option-icon sc-theme-option-icon--light" viewBox="0 0 18 18" aria-hidden="true">
                <g class="sc-theme-option-rays">
                  <line x1="9" y1="1.2" x2="9" y2="3"></line>
                  <line x1="9" y1="15" x2="9" y2="16.8"></line>
                  <line x1="1.2" y1="9" x2="3" y2="9"></line>
                  <line x1="15" y1="9" x2="16.8" y2="9"></line>
                  <line x1="3.5" y1="3.5" x2="4.78" y2="4.78"></line>
                  <line x1="13.22" y1="13.22" x2="14.5" y2="14.5"></line>
                  <line x1="13.22" y1="4.78" x2="14.5" y2="3.5"></line>
                  <line x1="3.5" y1="14.5" x2="4.78" y2="13.22"></line>
                </g>
                <circle class="sc-theme-option-sun-disc" cx="9" cy="9" r="3.2"></circle>
              </svg>
              <span>Claro</span>
            </span>
            <span class="sc-theme-option-mark" aria-hidden="true"></span>
          </button>
          <button class="sc-theme-option" type="button" role="menuitemradio" aria-checked="false" data-sc-theme-option="dark">
            <span class="sc-theme-option-main">
              <svg class="sc-theme-option-icon sc-theme-option-icon--dark" viewBox="0 0 18 18" aria-hidden="true">
                <defs>
                  <mask id="sc-theme-option-dark-mask">
                    <rect x="0" y="0" width="18" height="18" fill="#fff"></rect>
                    <circle class="sc-theme-option-dark-cut" cx="11.7" cy="6.35" r="4.45" fill="#000"></circle>
                  </mask>
                </defs>
                <circle class="sc-theme-option-dark-disc" cx="8.7" cy="9" r="5.6" mask="url(#sc-theme-option-dark-mask)"></circle>
              </svg>
              <span>Oscuro</span>
            </span>
            <span class="sc-theme-option-mark" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <button class="sc-catalog-view-toggle" type="button" aria-label="Cambiar vista de productos" title="Cambiar vista">
        <svg class="sc-morph-icon sc-view-layout-icon" viewBox="0 0 24 24" aria-hidden="true" data-sc-view-icon>
          <rect data-sc-view-cell="0" x="3" y="3" width="8" height="4" rx="1.1"></rect>
          <rect data-sc-view-cell="1" x="13" y="3" width="8" height="4" rx="1.1"></rect>
          <rect data-sc-view-cell="2" x="3" y="10" width="8" height="4" rx="1.1"></rect>
          <rect data-sc-view-cell="3" x="13" y="10" width="8" height="4" rx="1.1"></rect>
          <rect data-sc-view-cell="4" x="3" y="17" width="8" height="4" rx="1.1"></rect>
          <rect data-sc-view-cell="5" x="13" y="17" width="8" height="4" rx="1.1"></rect>
        </svg>
      </button>
    </div>
    <span class="sc-catalog-search-status sc-sr-only" aria-live="polite"></span>
    <div class="sc-catalog-search-results" aria-label="Resultados de búsqueda" hidden>
      <section class="sc-catalog-search-group" data-sc-search-group-prototype hidden>
        <h2 class="sc-catalog-search-group-title"></h2>
        <div class="sc-catalog-search-grid listadoShop"></div>
      </section>
      <p class="sc-catalog-search-empty-message" hidden>No encontramos productos para esa búsqueda.</p>
    </div>
  </section>
</template>
