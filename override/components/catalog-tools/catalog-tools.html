<template data-sc-template="catalog-tools">
  <section class="sc-catalog-tools" aria-label="Herramientas de la carta">
    <label class="sc-catalog-search">
      <svg class="sc-catalog-search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
      <input class="sc-catalog-search-input" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Buscar en la carta" aria-label="Buscar productos en la carta">
      <span class="sc-catalog-search-line" aria-hidden="true"></span>
    </label>
    <div class="sc-catalog-actions">
      <div class="sc-theme-control">
        <button class="sc-theme-toggle" type="button" aria-label="Tema automático. Elegir tema" title="Elegir tema" aria-haspopup="menu" aria-expanded="false" aria-controls="sc-theme-menu">
          <svg class="sc-theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <mask id="sc-theme-disc-mask">
                <rect x="0" y="0" width="24" height="24" fill="#fff"></rect>
                <circle class="sc-theme-cut" cx="15.5" cy="8.5" r="5.15" fill="#000"></circle>
              </mask>
            </defs>
            <g class="sc-theme-rays">
              <line x1="12" y1="1.5" x2="12" y2="4"></line>
              <line x1="12" y1="20" x2="12" y2="22.5"></line>
              <line x1="1.5" y1="12" x2="4" y2="12"></line>
              <line x1="20" y1="12" x2="22.5" y2="12"></line>
              <line x1="4.58" y1="4.58" x2="6.35" y2="6.35"></line>
              <line x1="17.65" y1="17.65" x2="19.42" y2="19.42"></line>
              <line x1="17.65" y1="6.35" x2="19.42" y2="4.58"></line>
              <line x1="4.58" y1="19.42" x2="6.35" y2="17.65"></line>
            </g>
            <circle class="sc-theme-disc" cx="12" cy="12" r="5.15" mask="url(#sc-theme-disc-mask)"></circle>
          </svg>
          <span class="sc-theme-auto-mark" aria-hidden="true"></span>
        </button>
        <div class="sc-theme-menu" id="sc-theme-menu" role="menu" aria-label="Elegir tema" aria-hidden="true">
          <button class="sc-theme-option" type="button" role="menuitemradio" aria-checked="true" data-sc-theme-option="system"><span>Automático</span><span class="sc-theme-option-mark" aria-hidden="true"></span></button>
          <button class="sc-theme-option" type="button" role="menuitemradio" aria-checked="false" data-sc-theme-option="light"><span>Claro</span><span class="sc-theme-option-mark" aria-hidden="true"></span></button>
          <button class="sc-theme-option" type="button" role="menuitemradio" aria-checked="false" data-sc-theme-option="dark"><span>Oscuro</span><span class="sc-theme-option-mark" aria-hidden="true"></span></button>
        </div>
      </div>
      <button class="sc-catalog-view-toggle" type="button" aria-label="Cambiar vista de productos" title="Cambiar vista">
        <svg class="sc-morph-icon sc-view-layout-icon" viewBox="0 0 24 24" aria-hidden="true" data-sc-view-icon>
          <rect data-sc-view-cell="0" x="3" y="3" width="8" height="4" rx="1.1"></rect>
          <rect data-sc-view-cell="1" x="13" y="3" width="8" height="4" rx="1.1"></rect>
          <rect data-sc-view-cell="2" x="3" y="10" width="8" height="4" rx="1.1"></rect>
          <rect data-sc-view-cell="3" x="13" y="10" width="8" height="4" rx="1.1"></rect>
          <rect data-sc-view-cell="4" x="3" y="17" width="8" height="4" rx="1.1"></rect>
          <rect data-sc-view-cell="5" x="13" y="17" width="8" height="4" rx="1.1"></rect>
        </svg>
      </button>
    </div>
    <span class="sc-catalog-search-status sc-sr-only" aria-live="polite"></span>
    <div class="sc-catalog-search-results" aria-label="Resultados de búsqueda" hidden>
      <section class="sc-catalog-search-group" data-sc-search-group-prototype hidden>
        <h2 class="sc-catalog-search-group-title"></h2>
        <div class="sc-catalog-search-grid listadoShop"></div>
      </section>
      <p class="sc-catalog-search-empty-message" hidden>No encontramos productos para esa búsqueda.</p>
    </div>
  </section>
</template>
