<template data-sc-template="catalog-tools">
  <section class="sc-catalog-tools" aria-label="Herramientas de la carta">

      <span class="sc-catalog-search-line" aria-hidden="true"></span>
    </label>
    <div class="sc-catalog-actions">
      <button class="sc-theme-toggle" type="button" aria-label="Tema: sistema. Cambiar tema" title="Tema: sistema">
        <svg class="sc-morph-icon" viewBox="0 0 24 24" aria-hidden="true"><path data-sc-theme-icon-path d="M10.85 12.65h2.3L12 9l-1.15 3.65zM20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69L23.31 12 20 8.69zM14.3 16l-.7-2h-3.2l-.7 2H7.8L11 7h2l3.2 9h-1.9z"></path></svg>

        <svg class="sc-morph-icon" viewBox="0 0 24 24" aria-hidden="true"><path data-sc-view-icon-path d="M14.67,5v6.5H9.33V5H14.67z M15.67,11.5H21V5h-5.33V11.5z M14.67,19v-6.5H9.33V19H14.67z M15.67,12.5V19H21v-6.5H15.67z M8.33,12.5H3V19h5.33V12.5z M8.33,11.5V5H3v6.5H8.33z"></path></svg>
      </button>
    </div>
    <span class="sc-catalog-search-status sc-sr-only" aria-live="polite"></span>
    <div class="sc-catalog-search-results" aria-label="Resultados de búsqueda" hidden>
      <section class="sc-catalog-search-group" data-sc-search-group-prototype hidden>
        <h2 class="sc-catalog-search-group-title"></h2>
        <div class="sc-catalog-search-grid listadoShop"></div>
      </section>
      <p class="sc-catalog-search-empty-message" hidden>No encontramos productos para esa búsqueda.</p>
    </div>
  </section>
</template>
