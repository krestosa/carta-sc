name: One-shot Swiss card cache bust

on:
  push:
    branches:
      - diseño

permissions:
  contents: write

jobs:
  patch-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diseño
          fetch-depth: 0

      - name: Version catalogue assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '20260814-1532'
          new = '20260814-1245-card2'

          main = Path('_js_dev/main.js')
          s = main.read_text(encoding='utf-8')
          if old in s:
              main.write_text(s.replace(old, new), encoding='utf-8')
          elif new not in s:
              raise SystemExit('Expected catalogue asset version not found in _js_dev/main.js')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old_entry = f'_js_dev/main.js?v={old}'
          new_entry = f'_js_dev/main.js?v={new}'
          if old_entry in s:
              index.write_text(s.replace(old_entry, new_entry, 1), encoding='utf-8')
          elif new_entry not in s:
              raise SystemExit('Expected main.js entrypoint version not found in index.html')
          PY

      - name: Commit exact version bump
        shell: bash
        run: |
          if git diff --quiet -- _js_dev/main.js index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _js_dev/main.js index.html
          git commit -m "fix: publish Swiss card assets with fresh cache key"
          git push origin HEAD:diseño
