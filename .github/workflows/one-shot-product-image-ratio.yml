name: One-shot product image ratio publish

on:
  push:
    branches:
      - diseño

permissions:
  contents: write

jobs:
  publish-ratio-override:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diseño
          fetch-depth: 0

      - name: Wire intrinsic image override and refresh cache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '20260814-1258-ratio'

          main = Path('_js_dev/main.js')
          s = main.read_text(encoding='utf-8')
          marker = "addBlockingCss('sc-catalog-type-grid-css'"
          line = f"\taddBlockingCss('sc-product-image-ratio-css', 'overrides/product-image-ratio.css?v={version}');\n"
          if 'sc-product-image-ratio-css' not in s:
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('catalog type grid loader not found')
              end = s.find('\n', pos)
              if end < 0:
                  raise SystemExit('catalog type grid loader line malformed')
              s = s[:end+1] + line + s[end+1:]

          s = re.sub(r'(?<=\?v=)[A-Za-z0-9._-]+', version, s)
          main.write_text(s, encoding='utf-8')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          pattern = r'(_js_dev/main\.js\?v=)[^"\']+'
          s2, count = re.subn(pattern, rf'\g<1>{version}', s, count=1)
          if count != 1:
              raise SystemExit('versioned main.js entrypoint not found exactly once')
          index.write_text(s2, encoding='utf-8')
          PY

      - name: Commit exact loader changes
        shell: bash
        run: |
          if git diff --quiet -- _js_dev/main.js index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _js_dev/main.js index.html
          git commit -m "fix: publish intrinsic product image ratio"
          git push origin HEAD:diseño
