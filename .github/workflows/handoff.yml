name: Pages and Handoff

on:
  push:
    branches:
      - type

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: type-pages-handoff
  cancel-in-progress: true

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Build Pages and Handoff
        timeout-minutes: 15
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site

      - name: Upload Linux Handoff
        uses: actions/upload-artifact@v7
        with:
          name: handoff-linux-${{ github.sha }}
          path: handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Build Pages and Handoff
        timeout-minutes: 15
        run: npm run build

      - name: Upload Windows Handoff
        uses: actions/upload-artifact@v7
        with:
          name: handoff-windows-${{ github.sha }}
          path: handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6

  deploy:
    name: pages
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
