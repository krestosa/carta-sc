name: Handoff TypeScript

on:
  push:
    branches:
      - type
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handoff-type
  cancel-in-progress: true

jobs:
  handoff:
    if: github.ref == 'refs/heads/type'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Typecheck
        run: npm run typecheck

      - name: Validate source and runtime
        run: npm run validate

      - name: Build handoff
        run: npm run build:handoff

      - name: Validate handoff
        run: npm run validate:handoff

      - name: Verify handoff contract
        run: |
          set -euo pipefail
          test -s handoff/README.md
          test -s handoff/BUILD_SHA
          test -s handoff/compiled/index.html
          test -s handoff/compiled/.nojekyll
          test -d handoff/source/override
          test -s handoff/source/lab/pages/build.ts
          test -s handoff/source/package.json
          test -s handoff/source/package-lock.json
          test "$(cat handoff/BUILD_SHA)" = "$GITHUB_SHA"
          ! find handoff/source -type f \( -name '*.py' -o -name '*.mjs' -o -name '*.sh' -o -name 'requirements.txt' \) -print -quit | grep -q .

      - name: Upload handoff
        uses: actions/upload-artifact@v7
        with:
          name: handoff-${{ github.sha }}
          path: handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
