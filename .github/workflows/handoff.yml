name: TypeScript CI and Cross-Platform Handoff

on:
  push:
    branches:
      - type
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.ref == 'refs/heads/type' || (github.event_name == 'pull_request' && github.head_ref == 'type')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            node: '22'
          - platform: windows
            os: windows-latest
            node: '24'
    name: ci-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      TYPE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact type commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked out type SHA
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:TYPE_SHA) { throw "Checkout SHA mismatch: $actual != $env:TYPE_SHA" }

      - name: Run full TypeScript CI
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:TYPE_SHA
          npm run ci

      - name: Build handoff
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:TYPE_SHA
          npm run build:handoff

      - name: Validate handoff structure
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:TYPE_SHA
          npm run validate:handoff

      - name: Validate standalone handoff in browser
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:TYPE_SHA
          npm run validate:handoff:browser

      - name: Upload Windows handoff
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: handoff-${{ matrix.platform }}-${{ env.TYPE_SHA }}
          path: handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
