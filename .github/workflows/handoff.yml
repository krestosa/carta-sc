name: TypeScript CI and Handoff

on:
  push:
    branches:
      - type
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.ref == 'refs/heads/type' || (github.event_name == 'pull_request' && github.head_ref == 'type')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run full TypeScript CI
        run: npm run ci

      - name: Verify handoff contract
        run: |
          set -euo pipefail
          test -s handoff/README.md
          test -s handoff/BUILD_SHA
          test -s handoff/compiled/index.html
          test -s handoff/compiled/.nojekyll
          test -d handoff/source/override
          test -s handoff/source/lab/pages/build.ts
          test -s handoff/source/package.json
          test -s handoff/source/package-lock.json
          test "$(cat handoff/BUILD_SHA)" = "$GITHUB_SHA"
          ! find handoff/source -type f \( -name '*.py' -o -name '*.mjs' -o -name '*.sh' -o -name 'requirements.txt' \) -print -quit | grep -q .

      - name: Upload handoff
        uses: actions/upload-artifact@v7
        with:
          name: handoff-${{ github.sha }}
          path: handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
