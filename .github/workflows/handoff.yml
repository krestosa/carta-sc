name: TypeScript CI and Optional Handoff

on:
  push:
    branches:
      - type
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.ref == 'refs/heads/type' || (github.event_name == 'pull_request' && github.head_ref == 'type')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run full TypeScript CI
        run: npm run ci

      - name: Build temporary handoff
        if: github.event_name == 'workflow_dispatch'
        run: npm run handoff:temporary

      - name: Verify temporary handoff
        if: github.event_name == 'workflow_dispatch'
        run: npm run validate:handoff -- handoff .pages-site

      - name: Upload temporary handoff
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: handoff-${{ github.sha }}
          path: handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
