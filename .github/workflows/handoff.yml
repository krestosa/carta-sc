name: Temporary Corrected Handoff

on:
  push:
    branches:
      - type
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: corrected-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  handoff:
    if: github.ref == 'refs/heads/type' || (github.event_name == 'pull_request' && github.head_ref == 'type')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TYPE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact type commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked out type SHA
        run: test "$(git rev-parse HEAD)" = "$TYPE_SHA"

      - name: Run full TypeScript CI
        run: GITHUB_SHA="$TYPE_SHA" npm run ci

      - name: Build corrected handoff
        run: GITHUB_SHA="$TYPE_SHA" npm run handoff:temporary

      - name: Verify corrected handoff
        run: npm run validate:handoff -- .pages-site

      - name: Upload corrected handoff
        uses: actions/upload-artifact@v7
        with:
          name: handoff-${{ env.TYPE_SHA }}
          path: handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
