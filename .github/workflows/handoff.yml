name: Temporary Windows Handoff Validation

on:
  push:
    branches:
      - type

permissions:
  contents: read

concurrency:
  group: windows-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-handoff:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked out SHA
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout SHA mismatch: $actual != $env:GITHUB_SHA" }

      - name: Build handoff on Windows
        run: npm run build:handoff

      - name: Validate handoff on Windows
        run: npm run validate:handoff -- .pages-site
