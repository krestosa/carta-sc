name: Handoff

on:
  push:
    branches:
      - ux
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handoff-ux
  cancel-in-progress: true

jobs:
  handoff:
    if: github.ref == 'refs/heads/ux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/validate-overrides.mjs
          node scripts/validate-production-boundary.mjs
          node scripts/validate-responsive-contract.mjs
          bash -n lab/handoff/build-current.sh
          bash -n lab/handoff/build-handoff.sh

      - name: Build handoff
        shell: bash
        run: bash lab/handoff/build-current.sh

      - name: Verify handoff
        shell: bash
        run: |
          test -s handoff/README.md
          test -s handoff/BUILD_SHA
          test -s handoff/compiled/index.html
          test -s handoff/compiled/.nojekyll
          test -d handoff/source/override
          test -d handoff/source/tooling/scripts
          test -s handoff/source/tooling/build.py
          test -s handoff/source/tooling/.nojekyll
          test -x handoff/build-local.sh
          test -x handoff/serve-local.sh
          test -s handoff/build-local.ps1
          test -s handoff/serve-local.ps1
          test "$(cat handoff/BUILD_SHA)" = "$GITHUB_SHA"
          test -d handoff/compiled/_build
          test ! -e handoff/source/tooling/validators
          test ! -e handoff/source/tooling/scripts/validate-snapshot-override-integration.mjs
          test ! -e handoff/source/tooling/scripts/validate-build-local-assets.py
          test ! -e handoff/source/tooling/scripts/validate-build-html.py
          test ! -e handoff/source/tooling/scripts/validate-build-performance-budget.py
          test ! -e handoff/source/tooling/scripts/validate-system-load.py

      - name: Upload handoff
        uses: actions/upload-artifact@v4
        with:
          name: handoff-${{ github.sha }}
          path: handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
