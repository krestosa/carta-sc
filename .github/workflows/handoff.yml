name: Pages and Handoff

on:
  push:
    branches:
      - type

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: type-pages-handoff
  cancel-in-progress: true

jobs:
  linux:
    name: linux-node-24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Build Pages and Handoff
        timeout-minutes: 15
        run: npm run build

      - name: Rebuild isolated generated Handoff
        timeout-minutes: 10
        shell: bash
        run: |
          isolated="$RUNNER_TEMP/carta-sc-handoff"
          rm -rf "$isolated"
          cp -a handoff "$isolated"
          cd "$isolated"
          env -u GITHUB_SHA -u GITHUB_REF -u GITHUB_REPOSITORY -u GITHUB_WORKSPACE npm run build

      - name: Prepare Pages deployment marker
        run: : > .pages-site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site

      - name: Upload Linux Handoff
        uses: actions/upload-artifact@v7
        with:
          name: handoff-linux-node-24-${{ github.sha }}
          path: handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6

  windows:
    name: windows-node-24
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Build Pages and Handoff
        timeout-minutes: 15
        run: npm run build

      - name: Rebuild isolated generated Handoff
        timeout-minutes: 10
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'carta-sc-handoff'
          Remove-Item $isolated -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path handoff -Destination $isolated -Recurse
          Remove-Item Env:GITHUB_SHA -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_REF -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_REPOSITORY -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue
          Push-Location $isolated
          try {
            npm run build
          } finally {
            Pop-Location
          }

      - name: Upload Windows Handoff
        uses: actions/upload-artifact@v7
        with:
          name: handoff-windows-node-24-${{ github.sha }}
          path: handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6

  deploy:
    name: pages
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
