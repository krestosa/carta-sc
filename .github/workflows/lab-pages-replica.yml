name: LAB - Deploy latest replica to Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-latest-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Typecheck
        run: npm run typecheck

      - name: Validate source and runtime
        run: npm run validate

      - name: Build isolated Pages artifact
        run: npm run build:pages

      - name: Verify staged application contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve('.pages-site');
          const required = [
            'index.html',
            'override/main.css',
            'override/main.js',
          ];

          for (const relative of required) {
            const file = path.join(root, relative);
            if (!fs.existsSync(file) || !fs.statSync(file).isFile() || fs.statSync(file).size === 0) {
              throw new Error(`Missing or empty Pages artifact: ${relative}`);
            }
          }

          const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
            const full = path.join(dir, entry.name);
            return entry.isDirectory() ? walk(full) : [full];
          });

          const leakedTs = walk(root)
            .map((file) => path.relative(root, file).replaceAll(path.sep, '/'))
            .filter((file) => file.endsWith('.ts'));
          if (leakedTs.length) throw new Error(`TypeScript leaked into Pages artifact: ${leakedTs.join(', ')}`);

          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          const version = `const VERSION = '${process.env.GITHUB_SHA}';`;
          if (!html.includes(version)) throw new Error(`Pages artifact does not identify ${process.env.GITHUB_SHA}`);

          console.log(`Staged Pages contract passed for ${process.env.GITHUB_SHA}`);
          NODE

      - name: Create deployment manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve('.pages-site');
          const output = path.join(root, '_deploy-manifest.json');
          const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
            const full = path.join(dir, entry.name);
            return entry.isDirectory() ? walk(full) : [full];
          });
          const files = walk(root)
            .filter((file) => file !== output)
            .sort()
            .map((file) => {
              const bytes = fs.readFileSync(file);
              return {
                path: path.relative(root, file).replaceAll(path.sep, '/'),
                size: bytes.length,
                sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
              };
            });
          const manifest = {
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            fileCount: files.length,
            files,
          };
          fs.writeFileSync(output, `${JSON.stringify(manifest)}\n`);
          console.log(`Deployment manifest: ${files.length} files for ${process.env.GITHUB_SHA}`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.pages-site'

      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages serves exact artifact
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pageUrl = (process.env.PAGE_URL ?? '').replace(/\/$/, '');
          const sha = process.env.GITHUB_SHA ?? '';
          if (!pageUrl) throw new Error('Pages deployment did not return a public URL');
          if (!/^[0-9a-f]{40}$/i.test(sha)) throw new Error(`Invalid workflow SHA: ${sha}`);

          const expectedManifest = fs.readFileSync('.pages-site/_deploy-manifest.json', 'utf8');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function text(url) {
            const response = await fetch(url, {
              cache: 'no-store',
              headers: {
                'Cache-Control': 'no-cache, no-store, max-age=0',
                Pragma: 'no-cache',
              },
              signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) throw new Error(`${response.status} ${url}`);
            return response.text();
          }

          let lastError = null;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const nonce = `${sha}-${attempt}-${Date.now()}`;
            try {
              const [manifest, html, css, js] = await Promise.all([
                text(`${pageUrl}/_deploy-manifest.json?verify=${nonce}`),
                text(`${pageUrl}/?sc-deploy-verify=${nonce}`),
                text(`${pageUrl}/override/main.css?v=${sha}&verify=${nonce}`),
                text(`${pageUrl}/override/main.js?v=${sha}&verify=${nonce}`),
              ]);

              if (manifest !== expectedManifest) throw new Error('Public deployment manifest does not match staged artifact');
              if (!html.includes(`const VERSION = '${sha}';`)) throw new Error('Public HTML is not the workflow commit');
              if (css.trim().length < 1000) throw new Error('Public production CSS is unexpectedly small');
              if (js.trim().length < 100) throw new Error('Public production runtime entry is unexpectedly small');

              console.log(`Verified public Pages is serving exact workflow commit ${sha}`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Pages verification attempt ${attempt}/30 pending: ${error instanceof Error ? error.message : error}`);
              if (attempt < 30) await sleep(3000);
            }
          }

          throw new Error(`Pages deployment never converged to ${sha}: ${lastError instanceof Error ? lastError.message : lastError}`);
          NODE
