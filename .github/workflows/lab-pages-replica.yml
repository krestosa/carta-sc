name: LAB - Deploy ux replica to Pages

on:
  push:
    branches:
      - ux
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ux-lab
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/ux'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checked out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Guard against stale run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/ux" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$latest" = "$GITHUB_SHA"

      - name: Validate production frontend boundary
        shell: bash
        run: node scripts/validate-overrides.mjs

      - name: Validate lab tooling syntax
        shell: bash
        run: python3 -m compileall -q lab/pages/scripts

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install lab-only build dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-input -r lab/pages/requirements.txt

      - name: Build isolated Pages benchmark artifact
        shell: bash
        run: bash lab/pages/build.sh

      - name: Upload benchmark artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.pages-site'

      - name: Guard again before deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/ux" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$latest" = "$GITHUB_SHA"

      - name: Deploy exact lab artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
