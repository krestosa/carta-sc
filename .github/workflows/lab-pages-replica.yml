name: LAB - Deploy type replica to Pages

on:
  push:
    branches:
      - type
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-type-lab
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/type'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Guard against stale run
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/type'
            });
            if (data.object.sha !== context.sha) {
              core.setFailed(`Refusing stale Pages build: run=${context.sha}, type=${data.object.sha}`);
            }

      - name: Typecheck
        run: npm run typecheck

      - name: Validate source and runtime
        run: npm run validate

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build isolated Pages artifact
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.pages-site'
          include-hidden-files: true

      - name: Guard again before deploy
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/type'
            });
            if (data.object.sha !== context.sha) {
              core.setFailed(`Refusing stale Pages deploy: run=${context.sha}, type=${data.object.sha}`);
            }

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages serves exact type HEAD
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          for attempt in $(seq 1 30); do
            verify_url="${PAGE_URL%/}/?sc-deploy-verify=${GITHUB_SHA}-${attempt}"
            html=$(curl -fsSL --retry 3 --retry-delay 1 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$verify_url" || true)
            if grep -Fq "window.__scCatalogAssetVersion='${GITHUB_SHA}'" <<<"$html"; then
              echo "Verified public Pages is serving exact type HEAD $GITHUB_SHA"
              exit 0
            fi
            sleep 3
          done
          echo "Pages deployment completed but public HTML is not serving exact type HEAD $GITHUB_SHA" >&2
          exit 1
