name: LAB - Deploy latest replica to Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-latest-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Typecheck
        run: npm run typecheck

      - name: Validate source and runtime
        run: npm run validate

      - name: Build isolated Pages artifact
        run: npm run build:pages

      - name: Verify complete staged application
        shell: bash
        run: |
          set -euo pipefail
          test -s .pages-site/index.html
          test -s .pages-site/override/main.css
          test -s .pages-site/override/main.js
          test -s .pages-site/override/components/product-modal/motion.js
          test -s .pages-site/override/components/catalog-tools/catalog-tools.js
          test -s .pages-site/override/features/image-preloader/motion.js
          test -s .pages-site/override/components/product-card/reveal-motion.js
          ! test -e .pages-site/override/components/catalog-tools/icon-control-motion.js
          ! test -e .pages-site/override/components/catalog-tools/view-icon-interaction.js
          grep -Fq "const VERSION = '${GITHUB_SHA}';" .pages-site/index.html
          grep -Fq 'body.sushiShop .sc-product-modal__cart-button' .pages-site/override/main.css
          grep -Fq 'border-radius: 24px !important;' .pages-site/override/main.css
          grep -Fq 'border-radius: 50%;' .pages-site/override/main.css
          ! grep -Fq -- '--sc-icon-control-radius' .pages-site/override/main.css
          grep -Fq -- '--sc-image-preloader-cycle: 1500ms;' .pages-site/override/main.css
          grep -Fq 'sc-image-preloader-pulse' .pages-site/override/main.css
          grep -Fq 'sc-card-placeholder-loading' .pages-site/override/main.css
          grep -Fq 'border-top-color: transparent !important;' .pages-site/override/main.css
          grep -Fq 'const PULSE_CYCLE_MS = 1500;' .pages-site/override/features/image-preloader/motion.js
          grep -Fq 'const WAVE_ROW_DELAY_MS = 200;' .pages-site/override/features/image-preloader/motion.js
          grep -Fq 'const WAVE_COLUMN_DELAY_MS = 100;' .pages-site/override/features/image-preloader/motion.js
          grep -Fq 'const REVEAL_ALPHA_DURATION_MS = 80;' .pages-site/override/features/image-preloader/motion.js
          grep -Fq 'const RESET_OUTGOING_MS = 150;' .pages-site/override/features/image-preloader/motion.js
          grep -Fq 'const RESET_INCOMING_MS = 250;' .pages-site/override/features/image-preloader/motion.js
          ! grep -Fq 'card.style.top' .pages-site/override/components/product-card/reveal-motion.js
          grep -Fq 'this.#engine.opacity' .pages-site/override/components/product-card/reveal-motion.js
          ! grep -Fq 'translate3d(-42px,0,0) scale(1.08)' .pages-site/override/components/product-modal/motion.js
          ! grep -Fq 'clipPath' .pages-site/override/components/product-modal/motion.js
          ! grep -Fq 'springTransform' .pages-site/override/components/product-modal/motion.js
          ! grep -Fq 'icon-control-motion' .pages-site/override/components/catalog-tools/catalog-tools.js

      - name: Create deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve('.pages-site');
          const output = path.join(root, '_deploy-manifest.json');
          const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
            const full = path.join(dir, entry.name);
            return entry.isDirectory() ? walk(full) : [full];
          });
          const files = walk(root)
            .filter((file) => file !== output)
            .sort()
            .map((file) => {
              const bytes = fs.readFileSync(file);
              return {
                path: path.relative(root, file).replaceAll(path.sep, '/'),
                size: bytes.length,
                sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
              };
            });
          const manifest = {
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            fileCount: files.length,
            files,
          };
          fs.writeFileSync(output, `${JSON.stringify(manifest)}\n`);
          console.log(`Deployment manifest: ${files.length} files for ${process.env.GITHUB_SHA}`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.pages-site'

      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages serves exact artifact
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"

          for attempt in $(seq 1 30); do
            nonce="${GITHUB_SHA}-${attempt}"
            remote_manifest=$(mktemp)
            html=$(curl -fsSL --retry 3 --retry-delay 1 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "${PAGE_URL%/}/?sc-deploy-verify=${nonce}" || true)
            css=$(curl -fsSL --retry 3 --retry-delay 1 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "${PAGE_URL%/}/override/main.css?v=${GITHUB_SHA}&verify=${attempt}" || true)
            modal=$(curl -fsSL --retry 3 --retry-delay 1 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "${PAGE_URL%/}/override/components/product-modal/motion.js?v=${GITHUB_SHA}&verify=${attempt}" || true)
            catalog=$(curl -fsSL --retry 3 --retry-delay 1 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "${PAGE_URL%/}/override/components/catalog-tools/catalog-tools.js?v=${GITHUB_SHA}&verify=${attempt}" || true)
            preloader=$(curl -fsSL --retry 3 --retry-delay 1 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "${PAGE_URL%/}/override/features/image-preloader/motion.js?v=${GITHUB_SHA}&verify=${attempt}" || true)
            card_reveal=$(curl -fsSL --retry 3 --retry-delay 1 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "${PAGE_URL%/}/override/components/product-card/reveal-motion.js?v=${GITHUB_SHA}&verify=${attempt}" || true)
            curl -fsSL --retry 3 --retry-delay 1 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "${PAGE_URL%/}/_deploy-manifest.json?verify=${nonce}" \
              -o "$remote_manifest" || true

            if cmp -s .pages-site/_deploy-manifest.json "$remote_manifest" \
              && grep -Fq "const VERSION = '${GITHUB_SHA}';" <<<"$html" \
              && grep -Fq 'body.sushiShop .sc-product-modal__cart-button' <<<"$css" \
              && grep -Fq 'border-radius: 24px !important;' <<<"$css" \
              && grep -Fq 'border-radius: 50%;' <<<"$css" \
              && ! grep -Fq -- '--sc-icon-control-radius' <<<"$css" \
              && grep -Fq -- '--sc-image-preloader-cycle: 1500ms;' <<<"$css" \
              && grep -Fq 'sc-image-preloader-pulse' <<<"$css" \
              && grep -Fq 'sc-card-placeholder-loading' <<<"$css" \
              && grep -Fq 'border-top-color: transparent !important;' <<<"$css" \
              && grep -Fq 'const PULSE_CYCLE_MS = 1500;' <<<"$preloader" \
              && grep -Fq 'const WAVE_ROW_DELAY_MS = 200;' <<<"$preloader" \
              && grep -Fq 'const WAVE_COLUMN_DELAY_MS = 100;' <<<"$preloader" \
              && grep -Fq 'const REVEAL_ALPHA_DURATION_MS = 80;' <<<"$preloader" \
              && grep -Fq 'const RESET_OUTGOING_MS = 150;' <<<"$preloader" \
              && grep -Fq 'const RESET_INCOMING_MS = 250;' <<<"$preloader" \
              && ! grep -Fq 'card.style.top' <<<"$card_reveal" \
              && grep -Fq 'this.#engine.opacity' <<<"$card_reveal" \
              && ! grep -Fq 'translate3d(-42px,0,0) scale(1.08)' <<<"$modal" \
              && ! grep -Fq 'clipPath' <<<"$modal" \
              && ! grep -Fq 'springTransform' <<<"$modal" \
              && ! grep -Fq 'icon-control-motion' <<<"$catalog"; then
              echo "Verified public Pages is serving exact workflow commit $GITHUB_SHA"
              rm -f "$remote_manifest"
              exit 0
            fi

            rm -f "$remote_manifest"
            sleep 3
          done

          echo "Pages deployment completed but public assets do not match workflow commit $GITHUB_SHA" >&2
          exit 1
