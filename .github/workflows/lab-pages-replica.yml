name: LAB - Build type replica

on:
  push:
    branches:
      - type
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-type-lab
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/type'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Guard against stale run
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/type'
            });
            if (data.object.sha !== context.sha) {
              core.setFailed(`Refusing stale Pages build: run=${context.sha}, type=${data.object.sha}`);
            }

      - name: Typecheck
        run: npm run typecheck

      - name: Validate source and runtime
        run: npm run validate

      - name: Build isolated Pages artifact
        run: npm run build:pages

      - name: Guard artifact against stale HEAD
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/type'
            });
            if (data.object.sha !== context.sha) {
              core.setFailed(`Refusing stale Pages artifact: run=${context.sha}, type=${data.object.sha}`);
            }

      - name: Upload lab artifact
        uses: actions/upload-artifact@v7
        with:
          name: pages-lab-${{ github.sha }}
          path: '.pages-site'
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
