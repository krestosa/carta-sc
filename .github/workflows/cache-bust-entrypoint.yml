name: One-shot catalogue cache bust

on:
  push:
    branches:
      - diseño

permissions:
  contents: write

jobs:
  patch-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diseño
          fetch-depth: 0

      - name: Version catalogue bootstrap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="_js_dev/main.js"'
          new = 'src="_js_dev/main.js?v=20260814-1532"'
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Expected main.js entrypoint not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit exact entrypoint change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: version catalogue bootstrap"
          git push origin HEAD:diseño
