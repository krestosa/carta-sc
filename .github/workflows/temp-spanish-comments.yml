name: Revisión puntual de comentarios

on:
  push:
    branches:
      - temp-spanish-comments
    paths:
      - .github/workflows/temp-spanish-comments.yml

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Corregir y revisar comentarios
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';

          const ROOTS = ['override', 'lab', 'scripts', 'types'];
          const EXTENSIONS = new Set(['.ts', '.css', '.html']);
          const categoryHeaders = new Map([
            ['override/components/category-nav/active-state.ts', '// Determina y sincroniza cuál categoría está activa según la navegación y la posición de la página.'],
            ['override/components/category-nav/category-nav.ts', '// Orquesta la navegación por categorías y conecta estado activo, desplazamiento, riel e indicador.'],
            ['override/components/category-nav/config.ts', '// Centraliza la configuración local de la navegación por categorías sin duplicar decisiones globales del sistema.'],
            ['override/components/category-nav/core.ts', '// Agrupa selectores, utilidades y cálculos compartidos por la navegación de categorías.'],
            ['override/components/category-nav/indicator.ts', '// Mueve el indicador de categoría activa sin modificar la geometría de los elementos del riel.'],
            ['override/components/category-nav/layout.ts', '// Sincroniza la semántica y la distribución de la barra de categorías con la estructura disponible.'],
            ['override/components/category-nav/programmatic-scroll.ts', '// Gestiona el desplazamiento programático hacia una categoría y coordina temporalmente la observación automática.'],
            ['override/components/category-nav/rail-controls.ts', '// Controla las flechas laterales del riel según el desborde disponible y la posición actual.'],
            ['override/components/category-nav/rail-motion.ts', '// Define el movimiento del riel con aceleración y desaceleración suaves, respetando movimiento reducido.'],
            ['override/components/category-nav/rail-position.ts', '// Calcula la posición de centrado del riel y limita el desplazamiento para evitar sobrepasar sus extremos.'],
            ['override/components/category-nav/rail.ts', '// Coordina posición, controles y movimiento del riel horizontal de categorías.'],
            ['override/components/category-nav/scroll-geometry.ts', '// Calcula la geometría necesaria para alinear categorías y secciones durante el desplazamiento.'],
            ['override/components/category-nav/scroll-spy.ts', '// Observa las secciones visibles y actualiza la categoría activa sin competir con desplazamientos iniciados por el usuario.'],
            ['override/components/category-nav/sticky-state.ts', '// Sincroniza el estado fijo de la navegación de categorías con la posición del documento.'],
            ['override/components/category-nav/submenu.ts', '// Gestiona los submenús de categorías y mantiene sus estados accesibles sincronizados.'],
          ]);

          function walk(directory) {
            if (!fs.existsSync(directory)) return [];
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(target) : [target];
            });
          }
          const files = ROOTS.flatMap(walk).map((file) => file.replaceAll(path.sep, '/')).filter((file) => EXTENSIONS.has(path.extname(file)));

          const exact = new Map([
            ['<!-- Documenta la responsabilidad de product card dentro del componente product card y mantiene esa lógica en su propietario. -->', '<!-- Documenta la responsabilidad de este archivo dentro del componente de tarjeta de producto y mantiene esa lógica en su propietario. -->'],
            ['<!-- Templates auxiliares de las tarjetas. El runtime los clona para añadir información\n     accesible y rasgos visuales sin duplicar markup dentro de los módulos JavaScript. -->', '<!-- Plantillas auxiliares de las tarjetas. El entorno de ejecución las clona para añadir información\n     accesible y rasgos visuales sin duplicar marcado dentro de los módulos JavaScript. -->'],
            ['<!-- Contenedor reutilizable para los iconos de picante y vegetariano generados en runtime. -->', '<!-- Contenedor reutilizable para los iconos de picante y vegetariano generados en el entorno de ejecución. -->'],
            ['<!-- Documenta la responsabilidad de product modal dentro del componente product modal y mantiene esa lógica en su propietario. -->', '<!-- Documenta la responsabilidad de este archivo dentro del componente de detalle de producto y mantiene esa lógica en su propietario. -->'],
            ['<!-- Template estructural del detalle de producto. JavaScript completa imagen, texto, precio\n     y rasgos al abrir; el markup mantiene semántica de diálogo y acciones accesibles. -->', '<!-- Plantilla estructural del detalle de producto. JavaScript completa imagen, texto, precio\n     y rasgos al abrir; el marcado mantiene la semántica de diálogo y las acciones accesibles. -->'],
            ['<!-- La imagen se completa desde la card y se elimina si el producto no tiene recurso válido. -->', '<!-- La imagen se completa desde la tarjeta y se elimina si el producto no tiene un recurso válido. -->'],
            ['<!-- Footer reservado para precio normalizado y la acción externa de pedido. -->', '<!-- Pie reservado para el precio normalizado y la acción externa de pedido. -->'],
            ['<!-- Documenta la responsabilidad de catalog tools dentro del componente catalog tools y mantiene esa lógica en su propietario. -->', '<!-- Documenta la responsabilidad de este archivo dentro del componente de herramientas del catálogo y mantiene esa lógica en su propietario. -->'],
            ['<!-- Template completo de herramientas del catálogo. Reúne búsqueda, filtros, tema y cambio\n     de vista en un único bloque que el runtime monta y reutiliza sin duplicar controles. -->', '<!-- Plantilla completa de herramientas del catálogo. Reúne búsqueda, filtros, tema y cambio\n     de vista en un único bloque que el entorno de ejecución monta y reutiliza sin duplicar controles. -->'],
            ['<!-- Templates del riel de categorías. Se clonan en runtime para montar la barra,\n     los controles de overflow y el indicador sin duplicar markup en JavaScript. -->', '<!-- Plantillas del riel de categorías. Se clonan en el entorno de ejecución para montar la barra,\n     los controles de desborde y el indicador sin duplicar marcado en JavaScript. -->'],
            ['<!-- Flecha izquierda; el runtime controla visibilidad, disabled y desplazamiento. -->', '<!-- Flecha izquierda; el entorno de ejecución controla la visibilidad, el estado deshabilitado y el desplazamiento. -->'],
          ]);

          function genericSpanishHeader(file, source) {
            if (categoryHeaders.has(file)) {
              const lines = source.split('\n');
              if (lines[0]?.startsWith('// ')) lines[0] = categoryHeaders.get(file);
              return lines.join('\n');
            }
            if (file.endsWith('.ts') && /^\/\/ Documenta la (?:responsabilidad|tarea|etapa|normalización).*\n/.test(source)) {
              return source.replace(/^\/\/ Documenta la .*\n/, '// Explica la responsabilidad de este archivo dentro del código propio y mantiene su lógica en el ámbito que le corresponde.\n');
            }
            if (file.endsWith('.css') && /^\/\* Documenta la responsabilidad de .* \*\/\n/.test(source)) {
              return source.replace(/^\/\* Documenta la responsabilidad de .* \*\/\n/, '/* Explica la responsabilidad de esta hoja de estilos dentro de su componente o función propietaria. */\n');
            }
            if (file.endsWith('.html') && /^<!-- Documenta la responsabilidad de .* -->\n/.test(source)) {
              return source.replace(/^<!-- Documenta la responsabilidad de .* -->\n/, '<!-- Explica la responsabilidad de esta plantilla dentro de su componente propietario. -->\n');
            }
            return source;
          }

          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8');
            source = genericSpanishHeader(file, source);
            for (const [from, to] of exact) source = source.replaceAll(from, to);
            fs.writeFileSync(file, source);
          }

          function commentsFromTs(source) {
            const ranges = new Map();
            const parsed = ts.createSourceFile('fuente.ts', source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
            const collect = (position) => {
              ts.forEachLeadingCommentRange(source, position, (pos, end) => ranges.set(`${pos}:${end}`, source.slice(pos, end)));
              ts.forEachTrailingCommentRange(source, position, (pos, end) => ranges.set(`${pos}:${end}`, source.slice(pos, end)));
            };
            collect(0);
            const visit = (node) => { collect(node.pos); collect(node.end); ts.forEachChild(node, visit); };
            visit(parsed);
            return [...ranges.values()];
          }
          function comments(file, source) {
            if (file.endsWith('.ts')) return commentsFromTs(source);
            if (file.endsWith('.css')) return source.match(/\/\*[\s\S]*?\*\//g) ?? [];
            return source.match(/<!--[\s\S]*?-->/g) ?? [];
          }

          const english = /\b(?:the|and|with|without|from|when|where|while|must|should|keep|reusable|runtime|overflow|markup|disabled|generated|browser|page|layout|feature|controller|fallback|source|staging|host|scroll|sticky|hover|pressed|selected|loading|template|templates|indicator|current|native|caching|pipeline|optional|available|expected|missing|specific|geometry|decisions|shared|registry|sealed|component|behavior|belongs|remains)\b/i;
          const allowedTechnical = /(?:https?:\/\/|\.js\b|\.ts\b|\.css\b|`[^`]+`|--sc-[\w-]+|data-sc-[\w-]+)/g;
          const failures = [];
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const found = comments(file, source);
            if (!found.length) failures.push(`${file}: sin comentario`);
            for (const comment of found) {
              const prose = comment.replace(allowedTechnical, '');
              const match = prose.match(english);
              if (match) failures.push(`${file}: “${match[0]}” en ${comment.replace(/\s+/g, ' ').slice(0, 180)}`);
            }
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`Revisados ${files.length} archivos propios: todos tienen comentarios y no quedan coincidencias de prosa inglesa auditada.`);
          NODE
      - name: Verificar proyecto
        run: npm run verify
      - name: Guardar resultado limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-spanish-comments.yml
          git add override lab scripts types tokens
          git commit -m "Completar comentarios en español"
          git push origin HEAD:temp-spanish-comments
