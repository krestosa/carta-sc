name: Type migration bootstrap

on:
  push:
    branches: [type]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: type-migration-bootstrap
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: type
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep deterministic lockfile current
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "build(type): refresh deterministic npm lockfile"
            git push origin HEAD:type
          fi
      - name: Package branch snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.build \
            --exclude=.generated \
            --exclude=.pages-site \
            --exclude=handoff \
            -czf /tmp/type-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: type-source-snapshot
          path: /tmp/type-source.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Record snapshot run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .migration
          printf '%s\n' "$GITHUB_RUN_ID" > .migration/latest-run-id.txt
          git add -- .migration/latest-run-id.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(type): record migration snapshot run"
          git push origin HEAD:type
