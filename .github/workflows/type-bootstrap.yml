name: Type migration bootstrap

on:
  push:
    branches: [type]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: type-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
