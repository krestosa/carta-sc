name: Type recovery bootstrap

on:
  push:
    branches: [type]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Package branch snapshot
        run: tar --exclude=.git -czf /tmp/type-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: type-source-snapshot
          path: /tmp/type-source.tgz
          if-no-files-found: error
          retention-days: 1
