name: Apply TypeScript migration batch

on:
  push:
    branches: [type]
    paths:
      - '.migration/strict-fixes.tgz'
      - '.github/workflows/type-payload-inspect.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: type
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact migration batch
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .migration/strict-fixes.tgz -C .
          npm ci
          npm run typecheck
          git diff --check
      - name: Publish validated batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add types/browser.d.ts override/core/variables.ts scripts/validate-overrides.ts lab/pages/validators.ts
          if git diff --cached --quiet; then
            echo 'No migration changes to publish.'
            exit 0
          fi
          git commit -m 'refactor(type): consolidate strict contracts and Pages validators'
          git push origin HEAD:type
