name: Deploy latest ux to Pages

on:
  push:
    branches:
      - ux
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ux-latest
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/ux'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel competing legacy Pages runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=ux&per_page=100" \
            > /tmp/pages-runs.json

          python3 - <<'PY' > /tmp/pages-run-ids.txt
          import json
          data=json.load(open('/tmp/pages-runs.json'))
          active={'queued','in_progress','pending','waiting','requested'}
          for run in data.get('workflow_runs',[]):
              if run.get('path')=='dynamic/pages/pages-build-deployment' and run.get('status') in active:
                  print(run['id'])
          PY

          while read -r run_id; do
            [ -n "$run_id" ] || continue
            code=$(curl -sS -o /tmp/pages-run-cancel.txt -w '%{http_code}' \
              -L -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")
            case "$code" in
              202|409) ;;
              *) cat /tmp/pages-run-cancel.txt; exit 1 ;;
            esac
          done < /tmp/pages-run-ids.txt

      - name: Cancel previous Pages deployment when possible
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/pages-cancel.txt -w '%{http_code}' \
            -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${PREVIOUS_SHA}/cancel")
          case "$code" in
            204|400|404|409|422) ;;
            *) cat /tmp/pages-cancel.txt; exit 1 ;;
          esac

      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checked out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Guard against stale run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/ux" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$latest" = "$GITHUB_SHA"

      - name: Validate override dependency graph
        shell: bash
        run: node scripts/validate-overrides.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare optimized Pages artifact
        shell: bash
        run: |
          rm -rf .pages-site
          mkdir -p .pages-site
          rsync -a --exclude='.git' --exclude='.pages-site' ./ .pages-site/

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          sha = os.environ['GITHUB_SHA']

          index = Path('.pages-site/index.html')
          text = index.read_text(encoding='utf-8')
          text, count = re.subn(
              r"_js_dev/main\.js\?v=[^\"']+",
              f'_js_dev/main.js?v={sha}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not rewrite the main.js entrypoint exactly once')
          index.write_text(text, encoding='utf-8')

          bootstrap = Path('.pages-site/_js_dev/main.js')
          text = bootstrap.read_text(encoding='utf-8')
          text, count = re.subn(
              r"var version='[^']+';",
              f"var version='{sha}';",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not stamp the bootstrap version exactly once')
          bootstrap.write_text(text, encoding='utf-8')

          css = Path('.pages-site/override/main.css')
          manifest = css.read_text(encoding='utf-8')
          import_re = re.compile(
              r'^\s*@import\s+["\'](?P<path>\./[^"\']+)\?v=unversioned["\'];\s*$',
              re.MULTILINE,
          )
          imports = [match.group('path') for match in import_re.finditer(manifest)]
          if not imports:
              raise SystemExit('No CSS imports were found to bundle')
          if import_re.sub('', manifest).strip():
              raise SystemExit('override/main.css contains non-import content; refusing unsafe bundle')

          url_re = re.compile(r'url\(\s*(?P<quote>["\']?)(?P<value>.*?)(?P=quote)\s*\)', re.IGNORECASE)

          def rewrite_urls(source, content):
              def replace(match):
                  value = match.group('value').strip()
                  if not value or re.match(r'^(?:[a-z][a-z0-9+.-]*:|//|/|#)', value, re.IGNORECASE):
                      return match.group(0)
                  parts = re.match(r'^(?P<path>[^?#]+)(?P<suffix>[?#].*)?$', value)
                  if not parts:
                      return match.group(0)
                  relative = parts.group('path')
                  suffix = parts.group('suffix') or ''
                  resolved = os.path.normpath(os.path.join(str(source.parent), relative))
                  rebased = os.path.relpath(resolved, start=str(css.parent)).replace(os.sep, '/')
                  quote = match.group('quote')
                  return f'url({quote}{rebased}{suffix}{quote})'
              return url_re.sub(replace, content)

          bundled = []
          for import_path in imports:
              source = css.parent / import_path.removeprefix('./')
              if not source.is_file():
                  raise SystemExit(f'Missing CSS source while bundling: {source}')
              content = source.read_text(encoding='utf-8')
              if '@import' in content:
                  raise SystemExit(f'Nested CSS import found while bundling: {source}')
              bundled.append(f'/* source: {import_path} */\n{rewrite_urls(source, content).rstrip()}')

          css.write_text('\n\n'.join(bundled) + '\n', encoding='utf-8')
          PY

          grep -F "_js_dev/main.js?v=${GITHUB_SHA}" .pages-site/index.html >/dev/null
          grep -F "var version='${GITHUB_SHA}';" .pages-site/_js_dev/main.js >/dev/null
          if grep -F '@import' .pages-site/override/main.css >/dev/null; then
            echo 'CSS imports remain in bundled Pages artifact'
            exit 1
          fi
          test "$(grep -c '^/\* source:' .pages-site/override/main.css)" -ge 1

      - name: Upload prepared Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.pages-site'

      - name: Guard again before deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/ux" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$latest" = "$GITHUB_SHA"

      - name: Deploy exact commit to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
