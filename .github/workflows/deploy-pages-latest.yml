name: Deploy latest ux to Pages

on:
  push:
    branches:
      - ux
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ux-latest
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/ux'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel competing legacy Pages runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=ux&per_page=100" \
            > /tmp/pages-runs.json

          python3 - <<'PY' > /tmp/pages-run-ids.txt
          import json
          data=json.load(open('/tmp/pages-runs.json'))
          active={'queued','in_progress','pending','waiting','requested'}
          for run in data.get('workflow_runs',[]):
              if run.get('path')=='dynamic/pages/pages-build-deployment' and run.get('status') in active:
                  print(run['id'])
          PY

          while read -r run_id; do
            [ -n "$run_id" ] || continue
            code=$(curl -sS -o /tmp/pages-run-cancel.txt -w '%{http_code}' \
              -L -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")
            case "$code" in
              202|409) ;;
              *) cat /tmp/pages-run-cancel.txt; exit 1 ;;
            esac
          done < /tmp/pages-run-ids.txt

      - name: Cancel previous Pages deployment when possible
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/pages-cancel.txt -w '%{http_code}' \
            -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${PREVIOUS_SHA}/cancel")
          case "$code" in
            204|400|404|409|422) ;;
            *) cat /tmp/pages-cancel.txt; exit 1 ;;
          esac

      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checked out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Guard against stale run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/ux" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$latest" = "$GITHUB_SHA"

      - name: Validate override dependency graph
        shell: bash
        run: |
          node scripts/validate-overrides.mjs
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for script in (
              'scripts/compile-pages-templates.py',
              'scripts/prepare-pages-artifact.py',
              'scripts/optimize-pages-critical-path.py',
              'scripts/clean-pages-product-images.py',
              'scripts/clean-pages-snapshot.py',
              'scripts/flatten-pages-bootstrap.py',
              'scripts/bundle-pages-legacy-css.py',
              'scripts/bundle-pages-legacy-js.py',
              'scripts/bundle-pages-shop-js.py',
              'scripts/optimize-pages-delivery.py',
              'scripts/optimize-pages-first-paint.py',
              'scripts/optimize-pages-first-viewport-media.py',
              'scripts/validate-pages-local-assets.py',
              'scripts/validate-pages-html.py',
              'scripts/validate-pages-performance-budget.py',
          ):
              ast.parse(Path(script).read_text(encoding='utf-8'))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install deterministic Pages build dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-pages.txt

      - name: Prepare optimized Pages artifact
        shell: bash
        run: |
          rm -rf .pages-site
          mkdir -p .pages-site
          rsync -a --exclude='.git' --exclude='.pages-site' ./ .pages-site/
          python3 scripts/compile-pages-templates.py
          python3 scripts/prepare-pages-artifact.py
          python3 scripts/optimize-pages-critical-path.py
          python3 scripts/clean-pages-product-images.py
          python3 scripts/clean-pages-snapshot.py
          python3 scripts/flatten-pages-bootstrap.py
          python3 scripts/bundle-pages-legacy-css.py
          python3 scripts/bundle-pages-legacy-js.py
          python3 scripts/bundle-pages-shop-js.py
          node --check .pages-site/override/main.js
          node --check .pages-site/_pages/legacy.js
          node --check .pages-site/_pages/shop.js
          python3 scripts/validate-pages-local-assets.py
          python3 scripts/validate-pages-html.py
          python3 scripts/validate-pages-performance-budget.py

          if grep -F 'src="_js_dev/main.js?v=' .pages-site/index.html >/dev/null; then
            echo 'Development bootstrap remains in Pages index'
            exit 1
          fi
          if grep -F 'data-sc-template=' .pages-site/index.html >/dev/null; then
            echo 'Override component templates must not be injected into Pages index.html'
            exit 1
          fi
          if grep -F 'var COMPILED_TEMPLATES=null;' .pages-site/override/main.js >/dev/null; then
            echo 'Override templates were not compiled into the production bundle'
            exit 1
          fi
          grep -F "src=\"_js_dev/main-legacy.js?v=${GITHUB_SHA}\"" .pages-site/index.html >/dev/null
          grep -F "rel=\"stylesheet\" href=\"override/main.css?v=${GITHUB_SHA}\"" .pages-site/index.html >/dev/null
          grep -F "src=\"override/main.js?v=${GITHUB_SHA}\"" .pages-site/index.html >/dev/null
          grep -F "var version='${GITHUB_SHA}';" .pages-site/_js_dev/main.js >/dev/null
          grep -F "_pages/legacy.css?v=${GITHUB_SHA}" .pages-site/index.html >/dev/null
          grep -F "_pages/legacy.js?v=${GITHUB_SHA}" .pages-site/index.html >/dev/null
          grep -F "_pages/shop.js?v=${GITHUB_SHA}" .pages-site/index.html >/dev/null
          test -s .pages-site/_pages/legacy.css
          test -s .pages-site/_pages/legacy.js
          test -s .pages-site/_pages/shop.js
          if grep -F '@import' .pages-site/override/main.css >/dev/null; then
            echo 'CSS imports remain in bundled Pages artifact'
            exit 1
          fi
          if grep -F 'loadStages([' .pages-site/override/main.js >/dev/null; then
            echo 'Development JS loader remains in bundled Pages artifact'
            exit 1
          fi
          test "$(grep -c '^/\* source:' .pages-site/override/main.css)" -ge 1
          test "$(grep -c '^/\* source:' .pages-site/_pages/legacy.css)" -eq 16
          test "$(grep -c '^/\* source:' .pages-site/_pages/legacy.js)" -eq 16
          test "$(grep -c '^/\* source:' .pages-site/_pages/shop.js)" -eq 2
          test "$(grep -c '^/\* module:' .pages-site/override/main.js)" -ge 1

          # Baseline delivery optimization: remove blocking CSS/JS and delay third parties.
          python3 scripts/optimize-pages-delivery.py

          # First-paint split: keep only geometry/layout-critical CSS in the document,
          # move the legacy/override runtime behind the first stable paint, and remove
          # redundant imgLiquid/Knormalize work from the generated Pages bundles.
          python3 scripts/optimize-pages-first-paint.py

          # Speed Index tier: keep the logo as the only parser-priority LCP image,
          # but prepare the four first catalogue images as small same-origin WebP
          # assets and release them immediately after the logo resource is ready.
          python3 scripts/optimize-pages-first-viewport-media.py

          node --check .pages-site/override/main.js
          node --check .pages-site/_pages/legacy.js
          node --check .pages-site/_pages/shop.js
          node --check .pages-site/_js_dev/main-legacy.js
          python3 scripts/validate-pages-local-assets.py
          python3 scripts/validate-pages-html.py
          grep -F 'id="sc-pages-critical-css"' .pages-site/index.html >/dev/null
          grep -F 'id="sc-pages-delivery-loader"' .pages-site/index.html >/dev/null
          test -s .pages-site/_pages/deferred.css
          test "$(grep -o 'data-sc-first-viewport=' .pages-site/index.html | wc -l)" -eq 4
          for n in 1 2 3 4; do
            test -s ".pages-site/_first-viewport/product-${n}.webp"
            test "$(stat -c%s ".pages-site/_first-viewport/product-${n}.webp")" -le 36000
          done
          grep -F "querySelectorAll('img[data-sc-first-viewport]')" .pages-site/index.html >/dev/null
          if grep -F '_pages/legacy.css?v=' .pages-site/index.html | grep -F 'rel="stylesheet"' >/dev/null; then
            echo 'Blocking legacy stylesheet remains after delivery optimization'
            exit 1
          fi
          if grep -F 'override/main.css?v=' .pages-site/index.html | grep -F 'rel="stylesheet"' >/dev/null; then
            echo 'Blocking override stylesheet remains after delivery optimization'
            exit 1
          fi
          if grep -F 'https://www.google.com/recaptcha/api.js" async defer' .pages-site/index.html >/dev/null; then
            echo 'Eager reCAPTCHA bootstrap remains after delivery optimization'
            exit 1
          fi
          if grep -F "googletagmanager.com/gtm.js?id='+i" .pages-site/index.html >/dev/null; then
            echo 'Eager GTM bootstrap remains after delivery optimization'
            exit 1
          fi

      - name: Upload prepared Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.pages-site'

      - name: Guard again before deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/ux" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$latest" = "$GITHUB_SHA"

      - name: Deploy exact commit to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
